name: Native Core and Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: C++ core (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build shared core
        run: cmake --build build --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

  windows-core:
    name: C++ core (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build shared core
        run: cmake --build build --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build WinUI application shell
        run: msbuild platforms/windows/AudioStudio/AudioStudio.csproj /restore /m /p:Configuration=Release /p:Platform=x64
      - name: Publish self-contained Windows app
        run: dotnet publish platforms/windows/AudioStudio/AudioStudio.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-self-contained /p:Platform=x64 /p:WindowsAppSDKSelfContained=true
      - name: Include native audio engine
        shell: pwsh
        run: Copy-Item build/Release/audio_studio_native.dll artifacts/windows-self-contained/audio_studio_native.dll
      - name: Upload self-contained Windows application
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-windows-self-contained
          path: artifacts/windows-self-contained/
          if-no-files-found: error
      - name: Upload Windows application shell
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-windows-shell
          path: platforms/windows/AudioStudio/bin/x64/Release/net8.0-windows10.0.19041.0/
          if-no-files-found: error

  android-debug:
    name: Android native shell and APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android debug APK
        run: gradle -p platforms/android :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-android-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
